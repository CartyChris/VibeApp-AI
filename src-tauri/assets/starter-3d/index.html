<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b6fd8">
<title>{{NAME}}</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #3b6fd8; color: #fff;
    font: 700 15px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; display: block; touch-action: none; }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); padding: 7px 13px; border-radius: 999px;
    background: rgba(10, 20, 45, .45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .4); font-variant-numeric: tabular-nums; }
  #gems { left: max(14px, env(safe-area-inset-left)); }
  #clock { right: max(14px, env(safe-area-inset-right)); }
  #stick { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
    width: 124px; height: 124px; border-radius: 50%; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .3);
    touch-action: none; display: none; }
  #knob { position: absolute; left: 36px; top: 36px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .55); }
  #jump { position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: max(36px, env(safe-area-inset-bottom));
    width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); background: rgba(80, 220, 140, .4);
    color: #fff; font: inherit; touch-action: none; display: none; }
  @media (pointer: coarse) { #stick, #jump { display: block; } }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; box-sizing: border-box;
    background: radial-gradient(ellipse at center, rgba(15, 25, 60, .35), rgba(5, 10, 30, .75)); }
  .overlay[hidden] { display: none; }
  #menu { align-items: end; background: linear-gradient(transparent 55%, rgba(5, 10, 30, .55)); padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 420px; text-align: center; padding: 22px 20px; border-radius: 22px;
    background: rgba(12, 22, 52, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .3px; }
  p { margin: 6px 0 14px; font-weight: 500; opacity: .85; }
  .heroes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .heroes button, .card > button { min-height: 44px; padding: 0 18px; border-radius: 22px; font: inherit; color: #fff; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); }
  .heroes button[aria-pressed="true"] { background: linear-gradient(135deg, #ff8a5c, #ff4f8b); border-color: transparent; }
  .card > button { background: linear-gradient(135deg, #3ee08f, #19b6c9); border-color: transparent; padding: 0 26px; }
  .hint { font-size: 12.5px; opacity: .7; margin: 12px 0 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="game" aria-label="3D game view"></canvas>
<div class="hud" id="gems" role="status" aria-live="polite">Gems 0 / 0</div>
<div class="hud" id="clock">0:00</div>
<div id="stick" aria-hidden="true"><div id="knob"></div></div>
<button id="jump" aria-label="Jump">Jump</button>
<div class="overlay" id="menu">
  <div class="card">
    <h1>{{NAME}}</h1>
    <p>Collect every gem across the sky islands.</p>
    <div class="heroes" id="heroes"></div>
    <button id="play">Play</button>
    <p class="hint">Move with WASD, the arrow keys or the stick. Jump twice with Space or the button.</p>
  </div>
</div>
<div class="overlay" id="done" hidden>
  <div class="card">
    <h1>All gems!</h1>
    <p id="result"></p>
    <button id="again">Play again</button>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
